<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaipur Jigsaw Rush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jaipur Jigsaw Rush</h1>
        <div class="stats">
            <div id="timer">00:00</div>
            <div id="piece-counter">0 / 64</div>
        </div>
    </header>

    <main>
        <div id="puzzle-board"></div>
        <div id="pieces-container"></div>
    </main>

    <div id="congratulations-modal" class="hidden">
        <div class="modal-content">
            <h2>Congratulations!</h2>
            <p>Your time: <span id="final-time"></span></p>
            <input type="text" id="player-name" placeholder="Enter your name">
            <button id="save-score">Save Score</button>
            <h3>Daily Leaderboard</h3>
            <ul id="leaderboard-list"></ul>
        </div>
    </div>

    <div class="monetization">
        <button id="hint-button">Hint</button>
        <button id="puzzle-packs-button">Puzzle Packs</button>
    </div>

    <div id="puzzle-packs-menu" class="hidden">
        <h3>Premium Puzzle Packs</h3>
        <ul>
            <li data-pack-id="rajasthan-forts">Rajasthan Forts Pack (Locked)</li>
            <li data-pack-id="indian-street-food">Indian Street Food Pack (Locked)</li>
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
